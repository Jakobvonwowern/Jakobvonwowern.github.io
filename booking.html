<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Booking - GreenCare Gardening</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <h1>GreenCare Gardening</h1>

      <nav class="main-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('services') }}">Services</a>
        <a href="{{ url_for('booking') }}">Request Booking</a>
        <a href="{{ url_for('privacy') }}">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h2>Request a Booking</h2>

    <p class="form-intro">
      Fill out the form below to request a gardening or winter maintenance service.
    </p>

    <form id="bookingForm" method="POST" action="{{ url_for('submit') }}" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Your full name" />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="yourname@example.com" />

      <label for="service">Choose a service</label>
      <select id="service" name="service">
        <option value="">Select a service</option>
        <option value="Lawn Mowing">Lawn Mowing</option>
        <option value="Hedge Trimming">Hedge Trimming</option>
        <option value="Snow Shoveling">Snow Shoveling</option>
        <option value="Winter Maintenance">Winter Maintenance</option>
      </select>

      <label for="message">Additional details</label>
      <textarea id="message" name="message" rows="5" placeholder="Tell us what you need help with..."></textarea>

      <button type="submit">Send Request</button>

      <p id="formMessage" class="form-message" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>© 2026 GreenCare Gardening Services</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
